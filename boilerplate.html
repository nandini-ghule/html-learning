<!DOCTYPE html>
<html lang="en">   <!-- tells browser that the language of webpage is English -->
<head>   <!--contains information about the webpage-->
    <meta charset="UTF-8">   <!--tells the browser how to decode the characters in the file-->
    <title>My HTML Learning</title>   <!--specifies the browser tab title-->
</head>
<body>  
    <h1>Hello, World!</h1>   <!-- heading -->
    <p>I am learning HTML.</p>   <!-- paragraph -->
</body>
</html>
