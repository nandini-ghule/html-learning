
<!DOCTYPE html>
<html>
<head>
    <title>Food Corner</title>
    <style>
        body {
            font-family: Arial;
            background-color: #fff8ef;
            text-align: center;
        }

        h1 {
            color: #b34420;
        }

        .menu {
            background: white;
            margin: 20px auto;
            padding: 20px;
            width: 300px;
            border-radius: 10px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            margin: 15px;
        }
    </style>
</head>

<body>

    <h1>Food Corner</h1>
    <p>Good Food, Good Mood!</p>

    <div class="menu">

        <h2>Our Menu</h2>

        <h3>Starters</h3>
        <div class="item">
            <span>French Fries</span>
            <span>₹99</span>
        </div>

        <div class="item">
            <span>Garlic Bread</span>
            <span>₹129</span>
        </div>

        <h3>Main Course</h3>
        <div class="item">
            <span>Pizza</span>
            <span>₹249</span>
        </div>

        <div class="item">
            <span>Burger</span>
            <span>₹149</span>
        </div>

        <h3>Desserts</h3>
        <div class="item">
            <span>Chocolate Cake</span>
            <span>₹99</span>
        </div>

    </div>

</body>
</html>
